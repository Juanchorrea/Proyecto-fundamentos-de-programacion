<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro de Ejercicio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="panel">
        <h1>Registro de Ejercicio</h1>
        <p class="lead">Ingresa tus datos para calcular ritmo y calorías quemadas.</p>

        <form action="/guardar" method="post">
          <div class="row">
            <div class="col">
              <label>Nombre</label>
              <input name="nombre" type="text" value="{{ nombre }}" placeholder="Tu nombre">
            </div>
            <div class="col">
              <label>Edad</label>
              <input name="edad" type="number" value="{{ edad }}" placeholder="0">
            </div>
          </div>

          <div class="row">
            <div class="col">
              <label>Peso (kg)</label>
              <input name="peso" type="number" step="0.1" value="{{ peso }}" placeholder="70">
            </div>
            <div class="col">
              <label>Tiempo (min)</label>
              <input name="tiempo" type="number" step="0.1" value="{{ tiempo }}" placeholder="30">
            </div>
          </div>

          <label>Distancia (km)</label>
          <input name="distancia" type="number" step="0.01" value="{{ distancia }}" placeholder="5">

          <button type="submit" class="btn">Calcular y Guardar</button>
        </form>
      </div>

      <div class="results">
        <h2>Resultados</h2>
        {% if nombre %}
          <p><strong>Nombre:</strong> {{ nombre }}</p>
          <p><strong>Ritmo:</strong> {{ ritmo }} km/h</p>
          <p><strong>Calorías:</strong> {{ calorias }} kcal</p>
        {% else %}
          <p>No hay resultados aún. Llena el formulario y presiona el botón.</p>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
